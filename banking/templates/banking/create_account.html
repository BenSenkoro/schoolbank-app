{% extends "base.html" %}

{% block title %}Create Account — Mbonea Bank{% endblock %}
{% block page_title %}Create New Account{% endblock %}



{% block content %}
<div style="max-width:560px;">

  <a href="{% url 'account_list' %}" style="
    display:inline-flex; align-items:center; gap:6px;
    color:#8199B3; font-size:13px; text-decoration:none; margin-bottom:24px;
  ">{% icon 'arrow-left' %} Back to Accounts</a>

  <div class="section-card">
    <h4>New Bank Account</h4>

    <form method="POST">
      {% csrf_token %}

      <div style="margin-bottom:20px;">
        <label for="id_user" style="display:block; font-size:12px; font-weight:500; color:#7A9BBF; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px;">
          Select Member
        </label>
        <select id="id_user" name="user" required style="
          width:100%; padding:13px 16px;
          background:#112240; border:1px solid #1E3A5F;
          border-radius:10px; color:#E0F0FF;
          font-size:14px; font-family:'Inter',sans-serif; outline:none;
        ">
          <option value="" disabled selected>-- Choose a student or teacher --</option>
          {% for user in users %}
            <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }} ({{ user.get_role_display }})</option>
          {% empty %}
            <option disabled>No eligible users found</option>
          {% endfor %}
        </select>
      </div>

      <div style="margin-bottom:20px;">
        <label for="id_account_type" style="display:block; font-size:12px; font-weight:500; color:#7A9BBF; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px;">
          Account Type
        </label>
        <select id="id_account_type" name="account_type" required style="
          width:100%; padding:13px 16px;
          background:#112240; border:1px solid #1E3A5F;
          border-radius:10px; color:#E0F0FF;
          font-size:14px; font-family:'Inter',sans-serif; outline:none;
        ">
          <option value="" disabled selected>-- Select type --</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>

      <div style="margin-bottom:28px;">
        <label for="id_initial_deposit" style="display:block; font-size:12px; font-weight:500; color:#7A9BBF; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px;">
          Initial Deposit (TZS)
        </label>
        <input id="id_initial_deposit" type="number" name="initial_deposit" min="0" value="0" style="
          width:100%; padding:13px 16px;
          background:#112240; border:1px solid #1E3A5F;
          border-radius:10px; color:#E0F0FF;
          font-size:14px; font-family:'Inter',sans-serif; outline:none;
        "/>
        <p style="font-size:12px; color:#6E8CAB; margin-top:6px;">Leave as 0 if no opening deposit.</p>
      </div>

      <button type="submit" style="
        width:100%; padding:14px;
        background:linear-gradient(135deg, #0077B6, #00B4D8);
        color:white; border:none; border-radius:10px;
        font-size:15px; font-weight:600;
        font-family:'Inter',sans-serif; cursor:pointer;
      ">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
